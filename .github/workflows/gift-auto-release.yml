name: Gift - Auto Sync & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      phase:
        description: "Phase name (e.g. Phase 1 Steps 1-20)"
        required: true
        default: "Manual Release"
      version:
        description: "Version tag (e.g. v1.0.0)"
        required: true
        default: "v1.0.0"

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint & Type Check
        run: |
          npm run lint || true
          npm run type-check || true

      - name: Build
        run: npm run build

      - name: Create Release Artifacts
        run: |
          mkdir -p gift-artifacts
          zip -r gift-artifacts/source-code-${{ github.ref_name || inputs.version }}.zip . -x "node_modules/*" ".next/*" ".git/*" "gift-artifacts/*" "*.log" ".env.secret" ".env.local" ".env.production" -q
          zip -r gift-artifacts/build-${{ github.ref_name || inputs.version }}.zip .next package.json -q || true
          cat > gift-artifacts/release-notes.md << 'EOF'
          # ${{ inputs.phase || 'Auto Release' }} - ${{ github.ref_name || inputs.version }}
          
          **iNAYATechLab Inc. - Manpower Agency SaaS**
          **Super Admin:** Samiullah Pk
          **Repo:** iNAYATechLab/manpower-agency-saas
          
          Auto-generated release from GitHub Actions.
          EOF
          ls -lh gift-artifacts/

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: gift-artifacts/*
          generate_release_notes: true
          body: |
            🎁 **Gift Release** - ${{ inputs.phase || github.ref_name }}
            Auto-synced from private repo `manpower-agency-saas`
            
            **Install:**
            ```bash
            npm install
            npm run dev
            ```

      - name: Push to Gift Repo (Mirror)
        if: env.GIFT_TOKEN != ''
        env:
          GIFT_TOKEN: ${{ secrets.GIFT_TOKEN }}
          GIFT_REPO: ${{ secrets.GIFT_REPO || 'manpower-agency-saas-gift' }}
        run: |
          if [ -z "$GIFT_TOKEN" ]; then
            echo "GIFT_TOKEN not set - skipping gift mirror"
            exit 0
          fi
          git remote add gift https://${GIFT_TOKEN}@github.com/iNAYATechLab/${GIFT_REPO}.git || git remote set-url gift https://${GIFT_TOKEN}@github.com/iNAYATechLab/${GIFT_REPO}.git
          git push gift main --force
          git push gift --tags --force
          echo "✓ Pushed to gift repo: iNAYATechLab/${GIFT_REPO}"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gift-release-${{ github.ref_name || 'manual' }}
          path: gift-artifacts/
          retention-days: 30
