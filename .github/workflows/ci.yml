name: CI - Build & Security Check

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run type-check
      - run: npm run build
      - name: Check for leaked secrets
        run: |
          ! grep -r "GITHUB_TOKEN_ENCRYPTED" --include="*.ts" --include="*.tsx" app/ components/ || (echo "Secret leaked in code!" && exit 1)
          echo "No secrets leaked ✓"
